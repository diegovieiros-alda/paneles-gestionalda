name: CI

# Solo integracion continua (tests/lint/build) -- no despliega a
# paneles.gestionalda.es. El despliegue sigue siendo manual (SSH + git pull
# + reinicio de gunicorn), sin cambios por este workflow.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: paneles_gestionalda
          POSTGRES_USER: paneles_app
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DB_NAME: paneles_gestionalda
      DB_USER: paneles_app
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: 5432
      # La conexion 'odoo' nunca se usa en los tests (solo SimpleTestCase,
      # sin BD; y el router de core/db_routers.py impide migrar ahi) -- no
      # hace falta ninguna credencial real de Odoo para que CI pase.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check + build
        working-directory: frontend
        run: npm run build
